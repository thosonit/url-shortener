openapi: 3.1.0

info:
  title: URL Shortener API
  version: 1.0.0
  description: |
    REST surface for the URL shortener. Two surfaces:

    - **App / Public** (`/api/*`, `/{code}`) — anonymous or user session.
    - **CMS / Admin** (`/admin/*`) — admin+ permission, enforced server-side (FC-RBAC).

    Derived from `features.md` and the data contract in `database.md`.

    **Response envelope.** Every JSON endpoint returns a consistent envelope
    (`success`/`data`/`error`, plus `meta` on list endpoints). The redirect route
    `GET /{code}` is the only non-JSON endpoint — it returns HTTP redirects/pages.

    **Pagination.** List endpoints accept `page` (1-based) and `limit` (default 20, max 100).

    **Auth.** Anonymous visitors get a signed `anon_session_id` cookie (ties links to the
    browser for later claim, FA-SIGNIN.2). Users authenticate via an Auth.js session cookie.
    Admin routes additionally require `role ∈ {admin, super_admin}` with a shorter session TTL
    (FC-RBAC.3); checks are by **permission**, not role string (FC-RBAC.1).

servers:
  - url: https://short.example
    description: Production

tags:
  - name: Links (public)
    description: Create links, read your own history, and manage your own links (FA-SHORTEN, FA-HISTORY, FA-MANAGE).
  - name: Redirect
    description: Resolve a short code (FA-REDIRECT, FA-EXPIRY).
  - name: Auth
    description: Auth.js Google OAuth + anonymous-link claim (FA-SIGNIN).
  - name: Admin · Dashboard
    description: KPI snapshot (FC-DASH).
  - name: Admin · Links
    description: Search and moderate links (FC-LINKS).
  - name: Admin · Users
    description: Browse users and manage accounts/roles (FC-RBAC, FC-USERS).

security:
  - {}                      # most public reads need no auth
  - sessionCookie: []

paths:
  #============================================================
  # App / Public
  #============================================================

  /api/links:
    post:
      tags: [Links (public)]
      summary: Create a short link
      description: |
        Anonymous or authenticated.

        - Accepts `http`/`https` only; rejects malformed and self-referential URLs (FA-SHORTEN.1).
        - `expiresAt` omitted → default TTL (FA-EXPIRY): anonymous = `now + 30d`,
          authenticated = permanent (`null`).
        - `expiresAt` supplied → anonymous is clamped to ≤ 30 days; authenticated is any future date.
        - `code` is server-generated as `base62(links.id)` — never client-supplied (FA-SHORTEN.2).
      operationId: createLink
      security:
        - {}
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      responses:
        '201':
          description: Link created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/CreatedLink' }
              example:
                success: true
                data:
                  code: a1B2c
                  shortUrl: https://short.example/a1B2c
                  originalUrl: https://example.com/very/long/path
                  expiresAt: '2026-07-12T12:00:00Z'
                error: null
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/me/links:
    get:
      tags: [Links (public)]
      summary: List own link history
      description: Authenticated user's link history (FA-HISTORY). Returns only links owned by the caller.
      operationId: listMyLinks
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated list of the caller's links.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MyLink' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
              example:
                success: true
                data:
                  - code: a1B2c
                    originalUrl: https://example.com
                    clickCount: 42
                    status: active
                    expiresAt: null
                    createdAt: '2026-06-01T10:00:00Z'
                error: null
                meta: { page: 1, limit: 20, total: 7 }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/me/links/{id}:
    patch:
      tags: [Links (public)]
      summary: Edit destination / disable own link
      description: |
        Update a link the caller owns (FA-MANAGE.1, FA-MANAGE.2). Send either field:

        - `url` → re-validated (`http`/`https`, non-self-referential, FA-SHORTEN.1) and stored as
          the new `original_url`. The `code` is unchanged.
        - `status` → `active` | `disabled`. Disabling makes the redirect return `404`
          (same status-only mechanism as FC-LINKS.2).

        Scoped to ownership: a link the caller does not own returns `404`, not `403`, so existence
        is never disclosed.
      operationId: updateMyLink
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/LinkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyLinkRequest'
            example: { url: https://example.com/new/destination }
      responses:
        '200': { $ref: '#/components/responses/MyLinkOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Links (public)]
      summary: Delete own link
      description: |
        Hard-delete a link the caller owns (FA-MANAGE.3). The row is removed, the redirect then
        returns `404`, and the `code` is never reused. Scoped to ownership: a link the caller does
        not own returns `404`.
      operationId: deleteMyLink
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/LinkId'
      responses:
        '204':
          description: Link deleted (no body).
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /{code}:
    get:
      tags: [Redirect]
      summary: Resolve a short code and redirect
      description: |
        **Not enveloped** — returns HTTP semantics directly.

        `302` (not `301`) is deliberate: a cached permanent redirect would bypass the server and
        break per-click counting. Disabled links return `404` (not `410`) so a takedown does not
        confirm the code ever existed. On a successful redirect only: increment
        `links.click_count` (FA-REDIRECT.1).
      operationId: resolveCode
      security:
        - {}
      parameters:
        - name: code
          in: path
          required: true
          description: Short code, `base62(links.id)`.
          schema: { type: string, example: a1B2c }
      responses:
        '302':
          description: Active link — redirect to `original_url`.
          headers:
            Location:
              description: The original URL.
              schema: { type: string, format: uri }
        '404':
          description: Unknown or owner-deleted code (FA-REDIRECT.3, FA-MANAGE.3), or disabled link (FC-LINKS.2, FA-MANAGE.2).
        '410':
          description: Expired link — "Link expired" page (FA-EXPIRY.3).

  #============================================================
  # Auth & account
  #============================================================

  /api/auth/signin/google:
    get:
      tags: [Auth]
      summary: Begin Google OAuth
      description: Auth.js Google OAuth flow (FA-SIGNIN.1).
      operationId: signinGoogle
      security:
        - {}
      responses:
        '302':
          description: Redirect to Google's consent screen.

  /api/auth/callback/google:
    get:
      tags: [Auth]
      summary: OAuth callback + anonymous-link claim
      description: |
        The callback upserts the user via `accounts(provider='google', provider_account_id=sub)`
        → user (else create), establishes a session, and **claims anonymous links** for the
        visitor's `anon_session_id` (FA-SIGNIN.2):

        ```sql
        UPDATE links SET user_id = :userId, expires_at = NULL
        WHERE anon_session_id = :anonId AND user_id IS NULL;
        ```

        Claimed links become permanent and appear in `GET /api/me/links`.
      operationId: callbackGoogle
      security:
        - {}
      responses:
        '302':
          description: Session established; redirect to the app.

  /api/auth/session:
    get:
      tags: [Auth]
      summary: Current session
      operationId: getSession
      responses:
        '200':
          description: Current Auth.js session (or empty when signed out).
          content:
            application/json:
              schema: { type: object }

  /api/auth/signout:
    post:
      tags: [Auth]
      summary: End session
      operationId: signout
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Session ended.

  #============================================================
  # CMS / Admin
  #============================================================

  /admin/stats:
    get:
      tags: [Admin · Dashboard]
      summary: KPI snapshot
      description: 'Requires permission `dashboard:read` (FC-DASH.1).'
      operationId: adminStats
      security:
        - sessionCookie: []
      responses:
        '200':
          description: KPI snapshot.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Stats' }
              example:
                success: true
                data: { totalLinks: 10423, linksToday: 87 }
                error: null
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/links:
    get:
      tags: [Admin · Links]
      summary: Search / filter links
      description: 'Requires permission `link:read` (FC-LINKS.1). Search by code/URL/owner/status.'
      operationId: adminListLinks
      security:
        - sessionCookie: []
      parameters:
        - name: query
          in: query
          description: Free-text match on code or original URL.
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LinkStatus' }
        - name: owner
          in: query
          description: Filter by owner email (case-insensitive); matches the email shown in results.
          schema: { type: string, format: email }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated link rows.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminLinkRow' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/links/{id}:
    get:
      tags: [Admin · Links]
      summary: Link detail + clicks
      description: 'Requires permission `link:read` (FC-LINKS.4).'
      operationId: adminGetLink
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/LinkId'
      responses:
        '200':
          description: Full link detail incl. `clickCount` and lifecycle state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/AdminLinkRow' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/links/{id}/disable:
    post:
      tags: [Admin · Links]
      summary: Disable a link
      description: |
        Requires permission `link:disable` (FC-LINKS.2). Sets `status='disabled'`;
        disabled links stop resolving (FA-REDIRECT).
      operationId: adminDisableLink
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/LinkId'
      responses:
        '200': { $ref: '#/components/responses/AdminLinkOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/links/{id}/enable:
    post:
      tags: [Admin · Links]
      summary: Re-enable a link
      description: "Requires permission `link:disable` (FC-LINKS.2). Restores `status='active'`."
      operationId: adminEnableLink
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/LinkId'
      responses:
        '200': { $ref: '#/components/responses/AdminLinkOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/links/{id}/expire:
    post:
      tags: [Admin · Links]
      summary: Force-expire now
      description: 'Requires permission `link:expire` (FC-LINKS.3). Sets `expires_at = now()` to retire immediately.'
      operationId: adminExpireLink
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/LinkId'
      responses:
        '200': { $ref: '#/components/responses/AdminLinkOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users:
    get:
      tags: [Admin · Users]
      summary: List / search users
      description: 'Requires permission `user:read` (FC-USERS.1).'
      operationId: adminListUsers
      security:
        - sessionCookie: []
      parameters:
        - name: query
          in: query
          description: Match on email (case-insensitive).
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated user rows.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminUser' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{id}:
    get:
      tags: [Admin · Users]
      summary: User detail
      description: 'Requires permission `user:read` (FC-USERS). Role, status, link count.'
      operationId: adminGetUser
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/AdminUserDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{id}/links:
    get:
      tags: [Admin · Users]
      summary: Links owned by user
      description: 'Requires permission `user:read` (FC-USERS.3).'
      operationId: adminGetUserLinks
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated links owned by the user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminLinkRow' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{id}/suspend:
    post:
      tags: [Admin · Users]
      summary: Suspend account
      description: |
        Requires permission `user:suspend` (FC-USERS.2). Sets `status='suspended'`;
        blocks the account's privileged actions.
      operationId: adminSuspendUser
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, example: Repeated abuse }
      responses:
        '200': { $ref: '#/components/responses/AdminUserOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{id}/unsuspend:
    post:
      tags: [Admin · Users]
      summary: Reinstate account
      description: "Requires permission `user:suspend` (FC-USERS.2). Restores `status='active'`."
      operationId: adminUnsuspendUser
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': { $ref: '#/components/responses/AdminUserOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{id}/role:
    post:
      tags: [Admin · Users]
      summary: Assign role
      description: '**Super-admin only** (`role:assign`, FC-RBAC.2).'
      operationId: adminAssignRole
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
            example: { role: admin }
      responses:
        '200': { $ref: '#/components/responses/AdminUserOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: |
        Auth.js session cookie. Admin routes additionally require an admin+ role and enforce
        permission checks server-side (FC-RBAC).

  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    LinkId:
      name: id
      in: path
      required: true
      description: Link id (bigint).
      schema: { type: string, example: '1042' }
    UserId:
      name: id
      in: path
      required: true
      description: User id (cuid).
      schema: { type: string, example: clx7y2k9p0000 }

  responses:
    ValidationError:
      description: Invalid input (FA-SHORTEN.1, FA-EXPIRY).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error: { code: VALIDATION_ERROR, message: Invalid URL }
    Unauthenticated:
      description: No valid session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error: { code: UNAUTHENTICATED, message: Sign-in required }
    Forbidden:
      description: Authenticated but lacks the required permission (FC-RBAC).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error: { code: FORBIDDEN, message: Insufficient permission }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error: { code: NOT_FOUND, message: Not found }
    AdminLinkOk:
      description: Updated link.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/AdminLinkRow' }
    MyLinkOk:
      description: Updated owned link (FA-MANAGE.1, FA-MANAGE.2).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/MyLink' }
    AdminUserOk:
      description: Updated user.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/AdminUser' }

  schemas:
    #---- enums ------------------------------------------------
    LinkStatus:
      type: string
      enum: [active, disabled]
      description: Stored link status (FC-LINKS.2). Resolved state also factors in expiry (FA-EXPIRY).
    UserRole:
      type: string
      enum: [user, admin, super_admin]
    UserStatus:
      type: string
      enum: [active, suspended]

    #---- envelope ---------------------------------------------
    Envelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: true }
        data: {}
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    ErrorEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: false }
        data: { type: 'null' }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, GONE, INTERNAL]
            message: { type: string }
    PageMeta:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 137 }

    #---- domain objects ---------------------------------------
    CreateLinkRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Long URL to shorten. `http`/`https` only, non-self-referential (FA-SHORTEN.1).
          example: https://example.com/very/long/path
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: |
            Optional. Anonymous callers are clamped to ≤ 30 days; authenticated callers may set
            any future date. Omitted → default TTL (FA-EXPIRY).
          example: '2026-07-01T00:00:00Z'
    UpdateMyLinkRequest:
      type: object
      minProperties: 1
      description: |
        Partial update of an owned link (FA-MANAGE). Supply at least one field. `url` edits the
        destination (FA-MANAGE.1); `status` disables/enables (FA-MANAGE.2).
      properties:
        url:
          type: string
          format: uri
          description: New destination. `http`/`https` only, non-self-referential (FA-SHORTEN.1). The `code` is unchanged.
          example: https://example.com/new/destination
        status:
          allOf: [{ $ref: '#/components/schemas/LinkStatus' }]
          description: '`disabled` makes the redirect return `404`; `active` restores it.'
    CreatedLink:
      type: object
      properties:
        code: { type: string, example: a1B2c }
        shortUrl: { type: string, format: uri, example: https://short.example/a1B2c }
        originalUrl: { type: string, format: uri }
        expiresAt: { type: [string, 'null'], format: date-time }
    MyLink:
      type: object
      description: |
        A link in the owner's history (FA-HISTORY). The owner resolves three states: `active`,
        `disabled` (stored `status`, set by the owner via FA-MANAGE or an admin via FC-LINKS), and
        `expired` (derived when `expiresAt` is in the past). The public redirect still returns `404`
        for disabled links.
      properties:
        code: { type: string, example: a1B2c }
        originalUrl: { type: string, format: uri }
        clickCount: { type: integer, example: 42 }
        status:
          allOf: [{ $ref: '#/components/schemas/LinkStatus' }]
          description: Stored status (`active`/`disabled`); `expired` is derived from `expiresAt`.
        expiresAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminLinkRow:
      type: object
      properties:
        id: { type: string, example: '1042' }
        code: { type: string, example: a1B2c }
        originalUrl: { type: string, format: uri }
        owner:
          type: [string, 'null']
          description: Owner email, or null for anonymous links.
          example: user@example.com
        status: { $ref: '#/components/schemas/LinkStatus' }
        clickCount: { type: integer, example: 42 }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminUser:
      type: object
      description: User row for list/mutation responses. `linkCount` is omitted here to avoid a per-row COUNT; see AdminUserDetail.
      properties:
        id: { type: string, example: clx7y2k9p0000 }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        createdAt: { type: string, format: date-time }
    AdminUserDetail:
      description: User detail (GET /admin/users/{id}); adds the owned-link count.
      allOf:
        - $ref: '#/components/schemas/AdminUser'
        - type: object
          properties:
            linkCount: { type: integer, example: 12 }
    Stats:
      type: object
      properties:
        totalLinks: { type: integer, example: 10423 }
        linksToday: { type: integer, example: 87 }
