<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sho.rt — URL Shortener</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  /* ===== Preview chrome (outside the scaled app) ===== */
  html, body { height: 100%; background: oklch(0.93 0.006 264); }
  #root { height: 100vh; }
  .viewer {
    height: 100vh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(100% 60% at 50% 0%, oklch(0.96 0.008 264), transparent 60%),
      oklch(0.925 0.007 264);
  }
  .viewer-bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: oklch(1 0 0 / 0.7);
    backdrop-filter: blur(12px) saturate(1.3);
    border-bottom: 1px solid oklch(0.86 0.008 264);
    font-family: "Inter Tight", system-ui, sans-serif;
    flex-wrap: wrap;
  }
  .vb-brand {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: oklch(0.4 0.02 264);
    letter-spacing: -0.01em;
  }
  .vb-dot { width: 8px; height: 8px; border-radius: 50%; background: oklch(0.55 0.24 264); box-shadow: 0 0 0 3px oklch(0.55 0.24 264 / 0.18); }
  .vb-seg {
    display: flex; gap: 2px;
    background: oklch(0.9 0.008 264);
    padding: 3px; border-radius: 10px;
  }
  .vb-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 12px;
    border: 0; border-radius: 7px; background: transparent;
    color: oklch(0.42 0.02 264); font-size: 13px; font-weight: 500;
    font-family: inherit; cursor: pointer;
    transition: background .14s ease, color .14s ease, box-shadow .14s ease;
  }
  .vb-btn:hover { color: oklch(0.25 0.02 264); }
  .vb-btn.on { background: #fff; color: oklch(0.2 0.02 264); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .vb-px { font-size: 11px; color: oklch(0.62 0.02 264); font-variant-numeric: tabular-nums; }
  .vb-btn.on .vb-px { color: oklch(0.55 0.24 264); }
  .vb-slider { display: flex; align-items: center; gap: 10px; }
  .vb-slider input[type=range] { width: 150px; accent-color: oklch(0.55 0.24 264); cursor: pointer; }
  .vb-slider input[disabled] { opacity: 0.4; cursor: not-allowed; }
  .vb-w { font-size: 12px; color: oklch(0.45 0.02 264); font-variant-numeric: tabular-nums; min-width: 46px; }
  .vb-states { margin-left: auto; }
  .vb-states select {
    height: 34px; border-radius: 9px;
    border: 1px solid oklch(0.84 0.01 264);
    background: #fff; color: oklch(0.3 0.02 264);
    font-family: inherit; font-size: 13px; font-weight: 500;
    padding: 0 12px; cursor: pointer;
  }
  .vb-states select:focus { outline: none; border-color: oklch(0.55 0.24 264); box-shadow: 0 0 0 3px oklch(0.55 0.24 264 / 0.25); }

  .viewer-stage {
    flex: 1; min-height: 0;
    position: relative;
    display: flex;
    justify-content: center;
    padding: 22px;
    overflow: hidden;
  }
  .frame {
    transform-origin: top center;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 40px oklch(0.3 0.04 264 / 0.16), 0 2px 8px oklch(0.3 0.04 264 / 0.1);
    overflow: hidden;
    flex: none;
    border: 1px solid oklch(0.88 0.008 264);
  }
  @media (max-width: 640px) {
    .viewer-bar { gap: 10px; padding: 8px 12px; }
    .vb-brand { display: none; }
    .vb-slider { display: none; }
    .viewer-stage { padding: 0; }
    .frame { border-radius: 0; border: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</body>
</html>
